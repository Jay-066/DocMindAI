# Render Blueprint for the DocMind AI backend (Express API).
# The frontend (Next.js) is deployed separately on Vercel with Root Directory "frontend".
# Values marked "sync: false" are secrets you enter in the Render dashboard when creating the
# Blueprint; they are never stored in this repo.
services:
  - type: web
    name: docmind-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      # The Vercel URL, e.g. https://docmind-ai.vercel.app (comma-separate to allow several)
      - key: FRONTEND_URL
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_FALLBACK_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: EVAL_JUDGE_PROVIDER
        value: groq
      - key: CHROMA_URL
        value: https://api.trychroma.com
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        sync: false
